<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="t d">
  <title id="t">PhoMiniPrint – Mini-Thermodrucker</title>
  <desc id="d">Illustration eines kleinen Taschen-Thermodruckers. Aus dem Druckschlitz kommt ein Papierstreifen mit Symbolen und einer Maßangabe von 40 mm. Rechts Bluetooth-Wellen zum PC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2129"/>
      <stop offset="1" stop-color="#0f1217"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f1"/>
      <stop offset="1" stop-color="#e4ddd2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1efea"/>
    </linearGradient>
  </defs>

  <rect width="800" height="460" rx="28" fill="url(#bg)"/>

  <!-- Schatten -->
  <ellipse cx="330" cy="408" rx="170" ry="16" fill="#000" opacity="0.45"/>

  <!-- Papierstreifen -->
  <g>
    <path d="M250 262 L250 70 L262 58 L274 70 L286 58 L298 70 L310 58 L322 70 L334 58 L346 70 L358 58 L370 70 L382 58 L394 70 L406 58 L418 70 L418 262 Z"
          fill="url(#paper)" stroke="#d8d2c8" stroke-width="2"/>
    <!-- Druckinhalt: Symbole -->
    <g fill="#1c1c1c" font-family="Segoe UI Symbol, Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle">
      <text x="290" y="118">★</text>
      <text x="334" y="118">✓</text>
      <text x="378" y="118">♥</text>
    </g>
    <text x="334" y="152" fill="#1c1c1c" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">PhoMiniPrint</text>
    <!-- Maßpfeil 40 mm -->
    <g stroke="#F26B1D" stroke-width="3" fill="#F26B1D">
      <line x1="268" y1="196" x2="400" y2="196"/>
      <path d="M266 196 l12 -7 v14 z" stroke="none"/>
      <path d="M402 196 l-12 -7 v14 z" stroke="none"/>
      <line x1="266" y1="184" x2="266" y2="208"/>
      <line x1="402" y1="184" x2="402" y2="208"/>
    </g>
    <text x="334" y="228" fill="#F26B1D" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">40 mm</text>
  </g>

  <!-- Druckergehäuse -->
  <rect x="180" y="250" width="300" height="150" rx="56" fill="url(#body)"/>
  <!-- Deckel -->
  <path d="M236 250 H424 a56 56 0 0 1 56 56 v4 H180 v-4 a56 56 0 0 1 56 -56 Z" fill="#F26B1D"/>
  <!-- Druckschlitz -->
  <rect x="238" y="258" width="192" height="10" rx="5" fill="#2a2a2a"/>
  <!-- Front: Taste und LED -->
  <circle cx="420" cy="352" r="16" fill="#F26B1D"/>
  <circle cx="420" cy="352" r="7" fill="none" stroke="#fff" stroke-width="2.5"/>
  <line x1="420" y1="341" x2="420" y2="350" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="378" cy="352" r="5" fill="#3ecf8e"/>
  <!-- Glanz -->
  <rect x="204" y="322" width="120" height="8" rx="4" fill="#fff" opacity="0.55"/>

  <!-- Bluetooth-Wellen -->
  <g fill="none" stroke="#F26B1D" stroke-width="5" stroke-linecap="round">
    <path d="M512 300 a26 26 0 0 1 0 40" opacity="1"/>
    <path d="M532 284 a48 48 0 0 1 0 72" opacity="0.75"/>
    <path d="M552 268 a70 70 0 0 1 0 104" opacity="0.5"/>
  </g>

  <!-- PC / Laptop -->
  <g>
    <rect x="600" y="262" width="150" height="96" rx="10" fill="#2b313b" stroke="#4a5260" stroke-width="3"/>
    <rect x="612" y="274" width="126" height="72" rx="4" fill="#12161c"/>
    <path d="M580 366 H770 l-14 18 H594 Z" fill="#3a414c"/>
    <!-- Mini-Fenster im Bildschirm -->
    <rect x="626" y="286" width="98" height="48" rx="4" fill="none" stroke="#F26B1D" stroke-width="3"/>
    <line x1="626" y1="297" x2="724" y2="297" stroke="#F26B1D" stroke-width="3"/>
    <rect x="640" y="306" width="70" height="20" rx="2" fill="#fff"/>
    <line x1="646" y1="316" x2="704" y2="316" stroke="#1c1c1c" stroke-width="3"/>
  </g>

  <!-- Titel -->
  <text x="760" y="70" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="end">PhoMiniPrint</text>
  <text x="760" y="100" fill="#aab3c0" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="end">Exakt drucken auf dem Mini-Thermodrucker</text>
</svg>
